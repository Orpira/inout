services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inout}
      POSTGRES_DB: inout
      TZ: America/Bogota
      PGTZ: America/Bogota
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inout"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://inout:${POSTGRES_PASSWORD:-inout}@db:5432/inout
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      MAX_HORAS_TURNO: ${MAX_HORAS_TURNO:-16}
      ANTIRREBOTE_SEGUNDOS: ${ANTIRREBOTE_SEGUNDOS:-60}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
